<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Web Radio Station</title>
    <style>
        body {
            background-color: #008080;
            font-family: "MS Sans Serif", Tahoma, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .window {
            background: #c0c0c0;
            border-top: 2px solid #dfdfdf;
            border-left: 2px solid #dfdfdf;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.5);
            width: 420px;
            padding: 3px;
        }
        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            padding: 4px 6px;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title-bar-controls button {
            background: #c0c0c0;
            border: 1px solid;
            border-color: #dfdfdf #404040 #404040 #dfdfdf;
            width: 16px;
            height: 14px;
            font-size: 9px;
            line-height: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        .window-body {
            padding: 10px;
        }
        .screen {
            background: #000;
            color: #00ff00;
            font-family: "Courier New", Courier, monospace;
            padding: 8px;
            border: inset 2px #808080;
            height: 75px;
            overflow: hidden;
            font-size: 12px;
            margin-bottom: 10px;
            line-height: 1.4;
            word-break: break-all;
        }
        .controls-group {
            background: #c0c0c0;
            border: groove 2px #dfdfdf;
            padding: 8px;
            margin-bottom: 10px;
        }
        select, button, input[type="range"] {
            font-family: "MS Sans Serif", Tahoma, Arial, sans-serif;
            font-size: 11px;
        }
        select {
            width: 100%;
            background: #fff;
            border: inset 2px #808080;
            padding: 3px;
            margin-bottom: 8px;
        }
        .btn-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }
        .btn {
            background: #c0c0c0;
            border: outset 2px #dfdfdf;
            padding: 4px 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:active {
            border: inset 2px #dfdfdf;
        }
        .volume-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
        }
        input[type="range"] {
            flex-grow: 1;
        }
        canvas {
            width: 100%;
            height: 35px;
            background: #000;
            border: inset 2px #808080;
            display: block;
            margin-top: 6px;
        }
        .status-bar {
            font-size: 11px;
            color: #333;
            border-top: 1px solid #808080;
            padding-top: 4px;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="title-bar">
            <span>📻 Retro Radio Station v1.1</span>
            <div class="title-bar-controls">
                <button>_</button>
                <button>□</button>
                <button>×</button>
            </div>
        </div>
        <div class="window-body">
            <div class="screen" id="lcd-screen">
                > Initializing system...<br>
                > Connecting to backend...
            </div>

            <div class="controls-group">
                <label for="station-select" style="font-size: 11px; display: block; margin-bottom: 3px;">Select Station:</label>
                <select id="station-select">
                    <option value="">-- Loading stations --</option>
                </select>

                <div class="btn-row">
                    <button class="btn" id="play-btn">▶ Play</button>
                    <button class="btn" id="stop-btn">⏹ Stop</button>
                </div>

                <div class="volume-box">
                    <span>Vol:</span>
                    <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.8">
                </div>

                <canvas id="visualizer"></canvas>
            </div>

            <audio id="audio-element"></audio>

            <div class="status-bar">
                <span id="connection-status">Status: Ready</span>
                <span>Proxy Enabled</span>
            </div>
        </div>
    </div>

    <script>
        let configData = {};
        const audioElement = document.getElementById('audio-element');
        const playBtn = document.getElementById('play-btn');
        const stopBtn = document.getElementById('stop-btn');
        const stationSelect = document.getElementById('station-select');
        const volSlider = document.getElementById('vol-slider');
        const lcdScreen = document.getElementById('lcd-screen');
        const statusLabel = document.getElementById('connection-status');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');

        let audioCtx, analyser, sourceNode;
        let isInitialized = false;

        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                configData = await res.json();
                
                stationSelect.innerHTML = '';
                let stationCount = 0;

                for (const section in configData) {
                    const data = configData[section];
                    const streamUrl = data.url || data.stream;
                    const stationName = data.name || section;

                    if (streamUrl) {
                        const opt = document.createElement('option');
                        opt.value = streamUrl;
                        opt.textContent = stationName;
                        stationSelect.appendChild(opt);
                        stationCount++;
                    }
                }

                if (stationCount === 0) {
                    for (const section in configData) {
                        const opt = document.createElement('option');
                        opt.value = configData[section].url || Object.values(configData[section])[0] || '';
                        opt.textContent = section;
                        stationSelect.appendChild(opt);
                        stationCount++;
                    }
                }

                lcdScreen.innerHTML = `> Config loaded successfully.<br>> Total stations: ${stationCount}`;
                statusLabel.textContent = 'Status: Online';
            } catch (err) {
                lcdScreen.innerHTML = `> Load config failed!<br>> ${err.message}`;
                statusLabel.textContent = 'Status: Error';
            }
        }

        function initAudioContext() {
            if (isInitialized) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64;
                
                audioElement.crossOrigin = "anonymous";
                sourceNode = audioCtx.createMediaElementSource(audioElement);
                sourceNode.connect(analyser);
                analyser.connect(audioCtx.destination);
                isInitialized = true;
            } catch (e) {
                console.warn('Web Audio API restricted:', e);
            }
        }

        playBtn.addEventListener('click', () => {
            const rawUrl = stationSelect.value;
            if (!rawUrl) {
                lcdScreen.innerHTML = `> Error: No valid stream URL!`;
                return;
            }

            // 通过 Worker 代理转发流，彻底解决 HTTP/CORS 阻断问题
            const proxyUrl = `/api/stream?url=${encodeURIComponent(rawUrl)}`;
            
            lcdScreen.innerHTML = `> Loading Stream...<br>> ${stationSelect.options[stationSelect.selectedIndex].text}`;
            
            initAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            audioElement.src = proxyUrl;
            audioElement.load();
            audioElement.play().then(() => {
                const currentName = stationSelect.options[stationSelect.selectedIndex].text;
                lcdScreen.innerHTML = `> Now Playing:<br>> ${currentName}`;
                statusLabel.textContent = 'Status: Playing';
            }).catch(err => {
                lcdScreen.innerHTML = `> Playback failed!<br>> Check if stream is alive.`;
                statusLabel.textContent = 'Status: Failed';
                console.error("Audio error:", err);
            });
        });

        stopBtn.addEventListener('click', () => {
            audioElement.pause();
            audioElement.src = '';
            lcdScreen.innerHTML = `> Player stopped.`;
            statusLabel.textContent = 'Status: Stopped';
        });

        volSlider.addEventListener('input', (e) => {
            audioElement.volume = e.target.value;
        });

        audioElement.volume = volSlider.value;

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            const width = canvas.width;
            const height = canvas.height;
            canvasCtx.fillStyle = '#000';
            canvasCtx.fillRect(0, 0, width, height);

            if (!analyser || audioElement.paused) {
                canvasCtx.fillStyle = '#003300';
                canvasCtx.fillRect(0, height / 2, width, 1);
                return;
            }

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            let barWidth = (width / bufferLength) * 2.5;
            let barHeight;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                barHeight = (dataArray[i] / 255) * height;
                canvasCtx.fillStyle = '#00ff00';
                canvasCtx.fillRect(x, height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }

        loadConfig();
        drawVisualizer();
    </script>
</body>
</html>
