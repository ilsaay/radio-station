<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="在线网络广播">
<title>广播电台</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
}

body{
    background:#f6f7f9;
    color:#222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;
}

.header{
    height:64px;
    background:#fff;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    color:#f04b23;
    font-size:22px;
    font-weight:700;
    margin-right:36px;
    white-space:nowrap;
}

.nav{
    display:flex;
    gap:28px;
}

.nav span{
    color:#666;
    cursor:pointer;
    font-size:14px;
}

.nav span.active{
    color:#f04b23;
    font-weight:600;
}

.search{
    width:260px;
    height:38px;
    margin-left:auto;
    border:0;
    outline:none;
    border-radius:20px;
    background:#f5f5f5;
    padding:0 17px;
    font-size:14px;
}

.main{
    max-width:1180px;
    margin:24px auto;
    padding:0 20px 120px;
}

.hero{
    min-height:155px;
    padding:30px;
    border-radius:18px;
    display:flex;
    align-items:center;
    background:
        linear-gradient(
            135deg,
            #fff1eb,
            #fff
        );
}

.hero h1{
    margin:0 0 10px;
    font-size:30px;
}

.hero p{
    margin:0;
    color:#888;
    font-size:14px;
}

.message{
    margin-top:18px;
}

.error{
    padding:14px 16px;
    background:#fff0f0;
    color:#c33;
    border-radius:10px;
    font-size:14px;
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fill,
            minmax(250px,1fr)
        );
    gap:18px;
    margin-top:24px;
}

.card{
    min-height:145px;
    padding:18px;
    background:#fff;
    border:1px solid #eee;
    border-radius:15px;
    cursor:pointer;
    transition:
        transform .15s,
        box-shadow .15s;
}

.card:hover{
    transform:translateY(-2px);
    box-shadow:
        0 8px 25px
        rgba(0,0,0,.06);
}

.cover{
    width:70px;
    height:70px;
    float:left;
    margin-right:15px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(
            135deg,
            #ff7043,
            #ffb199
        );
    color:#fff;
    font-size:30px;
}

.name{
    padding-top:5px;
    font-size:17px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.cat{
    margin-top:9px;
    color:#f04b23;
    font-size:12px;
}

.desc{
    clear:both;
    padding-top:16px;
    color:#999;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.empty{
    grid-column:1/-1;
    padding:60px 10px;
    text-align:center;
    color:#999;
}

.loading{
    grid-column:1/-1;
    padding:60px 10px;
    text-align:center;
    color:#999;
}

.player{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:20;

    min-height:78px;

    padding:12px 24px;

    display:flex;
    align-items:center;
    gap:16px;

    background:#fff;
    border-top:1px solid #ddd;
}

.play{
    width:48px;
    height:48px;
    flex:none;

    border:0;
    border-radius:50%;

    background:#f04b23;
    color:#fff;

    font-size:20px;
    cursor:pointer;
}

.current{
    width:190px;
    min-width:120px;
    overflow:hidden;
}

.current b{
    display:block;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.current small{
    display:block;
    margin-top:4px;

    color:#999;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.audio{
    flex:1;
    min-width:100px;
}

.status{
    color:#999;
    font-size:12px;
    white-space:nowrap;
}

@media(max-width:700px){

    .header{
        padding:0 14px;
    }

    .nav{
        display:none;
    }

    .search{
        width:160px;
    }

    .main{
        padding:
            0 12px
            120px;
    }

    .hero{
        padding:23px;
    }

    .hero h1{
        font-size:24px;
    }

    .player{
        padding:10px 12px;
        gap:10px;
    }

    .current{
        width:120px;
    }

    .audio{
        max-width:40vw;
    }

    .status{
        display:none;
    }
}
</style>
</head>

<body>

<header class="header">

    <div
        class="logo"
        id="siteName"
    >广播电台</div>

    <nav class="nav">
        <span class="active">推荐</span>
        <span>电台</span>
        <span>音乐</span>
    </nav>

    <input
        class="search"
        id="search"
        type="search"
        placeholder="搜索电台"
        autocomplete="off"
    >

</header>


<main class="main">

    <section class="hero">

        <div>

            <h1 id="heroTitle">
                在线广播
            </h1>

            <p id="heroDescription">
                收听你喜欢的网络电台
            </p>

        </div>

    </section>


    <div
        class="message"
        id="message"
    ></div>


    <section
        class="grid"
        id="grid"
    >

        <div class="loading">
            正在读取电台配置…
        </div>

    </section>

</main>


<div class="player">

    <button
        class="play"
        id="play"
        type="button"
    >▶</button>


    <div class="current">

        <b id="currentName">
            未选择电台
        </b>

        <small id="currentCategory">
            请选择一个电台
        </small>

    </div>


    <audio
        class="audio"
        id="audio"
        controls
        preload="none"
    ></audio>


    <div
        class="status"
        id="status"
    >就绪</div>

</div>


<script>
"use strict";

(function(){

    const audio =
        document.getElementById("audio");

    const grid =
        document.getElementById("grid");

    const message =
        document.getElementById("message");

    const search =
        document.getElementById("search");

    const play =
        document.getElementById("play");

    const siteName =
        document.getElementById("siteName");

    const heroTitle =
        document.getElementById("heroTitle");

    const heroDescription =
        document.getElementById("heroDescription");

    const currentName =
        document.getElementById("currentName");

    const currentCategory =
        document.getElementById("currentCategory");

    const status =
        document.getElementById("status");


    let stations = [];

    let current = null;


    function showError(text){

        message.textContent = "";

        const box =
            document.createElement("div");

        box.className = "error";

        box.textContent = text;

        message.appendChild(box);
    }


    function clearError(){

        message.textContent = "";
    }


    function render(list){

        grid.textContent = "";

        if(!list.length){

            const empty =
                document.createElement("div");

            empty.className = "empty";

            empty.textContent =
                "没有找到电台";

            grid.appendChild(empty);

            return;
        }


        list.forEach(function(station,index){

            const card =
                document.createElement("article");

            card.className = "card";


            const cover =
                document.createElement("div");

            cover.className = "cover";

            cover.textContent = "♪";


            const name =
                document.createElement("div");

            name.className = "name";

            name.textContent =
                station.name ||
                ("电台 " + (index + 1));


            const category =
                document.createElement("div");

            category.className = "cat";

            category.textContent =
                station.category ||
                "网络电台";


            const description =
                document.createElement("div");

            description.className = "desc";

            description.textContent =
                station.description ||
                station.url;


            card.appendChild(cover);
            card.appendChild(name);
            card.appendChild(category);
            card.appendChild(description);


            card.addEventListener(
                "click",
                function(){
                    playStation(station);
                }
            );


            grid.appendChild(card);

        });
    }


    function playStation(station){

        if(
            !station ||
            !station.url
        ){
            return;
        }


        current = station;


        currentName.textContent =
            station.name ||
            "网络电台";


        currentCategory.textContent =
            station.category ||
            "网络电台";


        status.textContent =
            "连接中…";


        audio.src =
            station.url;


        const promise =
            audio.play();


        if(
            promise &&
            typeof promise.catch === "function"
        ){

            promise.catch(function(){

                status.textContent =
                    "请点击播放";

            });
        }
    }


    play.addEventListener(
        "click",
        function(){

            if(!current){

                status.textContent =
                    "请先选择一个电台";

                return;
            }


            if(audio.paused){

                const promise =
                    audio.play();

                if(
                    promise &&
                    typeof promise.catch ===
                    "function"
                ){

                    promise.catch(function(){

                        status.textContent =
                            "播放失败";

                    });
                }

            }else{

                audio.pause();

            }

        }
    );


    audio.addEventListener(
        "play",
        function(){

            play.textContent = "Ⅱ";

            status.textContent =
                "正在播放";

        }
    );


    audio.addEventListener(
        "pause",
        function(){

            play.textContent = "▶";

        }
    );


    audio.addEventListener(
        "waiting",
        function(){

            status.textContent =
                "缓冲中…";

        }
    );


    audio.addEventListener(
        "playing",
        function(){

            status.textContent =
                "正在播放";

        }
    );


    audio.addEventListener(
        "error",
        function(){

            status.textContent =
                "播放失败";

        }
    );


    function loadStations(){

        fetch(
            "/api/stations",
            {
                method:"GET",
                cache:"no-store",
                headers:{
                    "Accept":
                        "application/json"
                }
            }
        )

        .then(function(response){

            if(!response.ok){

                throw new Error(
                    "服务器 HTTP " +
                    response.status
                );

            }

            return response.json();

        })

        .then(function(data){

            if(
                !data ||
                !Array.isArray(data.stations)
            ){

                throw new Error(
                    "服务器返回格式错误"
                );

            }


            stations =
                data.stations;


            if(data.site){

                if(data.site.name){

                    siteName.textContent =
                        data.site.name;

                    document.title =
                        data.site.name;
                }


                if(data.site.title){

                    heroTitle.textContent =
                        data.site.title;
                }


                if(data.site.description){

                    heroDescription.textContent =
                        data.site.description;
                }

            }


            render(stations);


            if(stations.length){

                clearError();

            }else{

                showError(
                    "config.ini 中尚未配置电台。"
                );

            }

        })

        .catch(function(error){

            if(stations.length){

                return;
            }


            grid.textContent = "";


            showError(
                "无法读取电台配置：" +
                error.message
            );

        });
    }


    search.addEventListener(
        "input",
        function(){

            const keyword =
                search.value
                    .trim()
                    .toLowerCase();


            if(!keyword){

                render(stations);

                return;
            }


            const result =
                stations.filter(
                    function(station){

                        const text = [
                            station.name,
                            station.category,
                            station.description
                        ]
                        .join(" ")
                        .toLowerCase();

                        return (
                            text.indexOf(
                                keyword
                            ) !== -1
                        );

                    }
                );


            render(result);

        }
    );


    loadStations();


    /*
     * 每 30 秒自动检查一次 GitHub 配置。
     */
    setInterval(
        loadStations,
        30000
    );

})();
</script>

</body>
</html>
