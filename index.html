<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#ff6a00"
>

<title>广播电台</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;

    background: #f5f5f5;
    color: #222;
}

body {
    padding-bottom: 100px;
}


/* =========================================================
   Header
   ========================================================= */

.header {

    height: 64px;

    background: #fff;

    border-bottom:
        1px solid #eee;

    display: flex;

    align-items: center;

    padding:
        0 28px;

    position: sticky;

    top: 0;

    z-index: 100;
}

.logo {

    font-size: 24px;

    font-weight: 800;

    color: #ff5a00;

    white-space: nowrap;
}

.nav {

    display: flex;

    margin-left: 38px;

    gap: 30px;

    height: 100%;

    align-items: center;
}

.nav-item {

    color: #555;

    text-decoration: none;

    font-size: 15px;
}

.nav-item.active {

    color: #ff5a00;

    font-weight: 700;
}

.search {

    margin-left: auto;

    width: 260px;

    height: 38px;

    border-radius: 20px;

    background: #f5f5f5;

    display: flex;

    align-items: center;

    padding: 0 16px;
}

.search input {

    border: 0;

    outline: 0;

    background: transparent;

    width: 100%;

    font-size: 14px;
}


/* =========================================================
   Hero
   ========================================================= */

.hero {

    max-width: 1200px;

    margin:
        24px auto;

    padding:
        38px 42px;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #ff7a18,
            #ff4b00
        );

    color: #fff;

    box-shadow:
        0 10px 30px
        rgba(255,90,0,.15);
}

.hero h1 {

    margin: 0 0 10px;

    font-size: 34px;
}

.hero p {

    margin: 0;

    opacity: .9;

    font-size: 15px;
}


/* =========================================================
   Container
   ========================================================= */

.container {

    max-width: 1200px;

    margin: 0 auto;

    padding: 0 20px;
}

.section-title {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin:
        30px 0 18px;
}

.section-title h2 {

    margin: 0;

    font-size: 22px;
}

.station-count {

    color: #999;

    font-size: 14px;
}


/* =========================================================
   Grid
   ========================================================= */

.grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(260px, 1fr)
        );

    gap: 18px;
}

.card {

    background: #fff;

    border-radius: 14px;

    padding: 20px;

    border:
        1px solid #eee;

    transition:
        transform .2s,
        box-shadow .2s;

    cursor: pointer;
}

.card:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.08);
}

.card.playing {

    border-color:
        #ff6a00;

    box-shadow:
        0 5px 20px
        rgba(255,106,0,.15);
}

.cover {

    width: 58px;

    height: 58px;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #ff7a18,
            #ff4b00
        );

    display: flex;

    align-items: center;

    justify-content: center;

    color: #fff;

    font-size: 25px;

    margin-bottom: 15px;
}

.card-name {

    font-size: 18px;

    font-weight: 700;

    margin-bottom: 7px;
}

.card-category {

    display: inline-block;

    background: #fff1e8;

    color: #ff6200;

    border-radius: 12px;

    padding:
        3px 9px;

    font-size: 12px;

    margin-bottom: 10px;
}

.card-description {

    color: #999;

    font-size: 13px;

    line-height: 1.6;

    min-height: 42px;
}

.play-button {

    margin-top: 16px;

    width: 100%;

    height: 38px;

    border: 0;

    border-radius: 20px;

    background: #fff1e8;

    color: #ff6200;

    font-weight: 600;

    cursor: pointer;
}

.card.playing
.play-button {

    background: #ff6200;

    color: #fff;
}


/* =========================================================
   Empty / Error
   ========================================================= */

.message {

    background: #fff;

    border-radius: 14px;

    padding: 50px 20px;

    text-align: center;

    color: #999;
}

.error {

    color: #d33;
}


/* =========================================================
   Player
   ========================================================= */

.player {

    position: fixed;

    left: 0;

    right: 0;

    bottom: 0;

    height: 82px;

    background:
        rgba(255,255,255,.97);

    border-top:
        1px solid #eee;

    backdrop-filter:
        blur(10px);

    z-index: 200;

    display: flex;

    align-items: center;

    padding:
        0 28px;
}

.player-info {

    min-width: 230px;

    max-width: 300px;
}

.player-name {

    font-weight: 700;

    font-size: 15px;
}

.player-status {

    font-size: 12px;

    color: #999;

    margin-top: 4px;
}

.player-controls {

    display: flex;

    align-items: center;

    margin-left: 25px;
}

.control {

    width: 48px;

    height: 48px;

    border-radius: 50%;

    border: 0;

    background: #ff6200;

    color: white;

    cursor: pointer;

    font-size: 20px;
}

.player-line {

    flex: 1;

    height: 3px;

    margin-left: 25px;

    background: #eee;

    border-radius: 5px;

    overflow: hidden;
}

.player-line-inner {

    height: 100%;

    width: 0;

    background: #ff6200;

    transition:
        width .2s;
}


/* =========================================================
   Responsive
   ========================================================= */

@media (max-width: 700px) {

    .header {

        padding: 0 15px;
    }

    .nav {

        display: none;
    }

    .search {

        width: 170px;
    }

    .hero {

        margin:
            15px;

        padding:
            28px;

    }

    .hero h1 {

        font-size: 27px;
    }

    .container {

        padding:
            0 15px;
    }

    .grid {

        grid-template-columns:
            1fr;
    }

    .player {

        height: 75px;

        padding:
            0 15px;
    }

    .player-info {

        min-width: 0;

        max-width: 150px;
    }

    .player-line {

        display: none;
    }
}

</style>

</head>


<body>


<header class="header">

    <div
        class="logo"
        id="siteLogo"
    >
        广播电台
    </div>


    <nav class="nav">

        <a
            href="#"
            class="nav-item active"
        >
            首页
        </a>

        <a
            href="#stations"
            class="nav-item"
        >
            电台
        </a>

    </nav>


    <div class="search">

        <input
            id="searchInput"
            type="search"
            placeholder="搜索电台..."
        >

    </div>

</header>



<section class="hero">

    <h1 id="heroTitle">
        在线广播
    </h1>

    <p id="heroDescription">
        收听你喜欢的网络电台
    </p>

</section>



<main
    class="container"
    id="stations"
>

    <div class="section-title">

        <h2>
            网络电台
        </h2>

        <span
            class="station-count"
            id="stationCount"
        >
            读取中...
        </span>

    </div>


    <div
        id="stationGrid"
        class="grid"
    >

        <div class="message">
            正在加载电台...
        </div>

    </div>

</main>



<div class="player">

    <div class="player-info">

        <div
            class="player-name"
            id="playerName"
        >
            未播放
        </div>

        <div
            class="player-status"
            id="playerStatus"
        >
            请选择一个电台
        </div>

    </div>


    <div class="player-controls">

        <button
            class="control"
            id="playButton"
            type="button"
        >
            ▶
        </button>

    </div>


    <div class="player-line">

        <div
            class="player-line-inner"
            id="playerLine"
        ></div>

    </div>

</div>



<audio
    id="audio"
    preload="none"
></audio>



<script>

/*
 * ============================================================
 * Radio Station Frontend
 * ============================================================
 */

const audio =
    document.getElementById(
        "audio"
    );

const stationGrid =
    document.getElementById(
        "stationGrid"
    );

const stationCount =
    document.getElementById(
        "stationCount"
    );

const playerName =
    document.getElementById(
        "playerName"
    );

const playerStatus =
    document.getElementById(
        "playerStatus"
    );

const playButton =
    document.getElementById(
        "playButton"
    );

const playerLine =
    document.getElementById(
        "playerLine"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const siteLogo =
    document.getElementById(
        "siteLogo"
    );

const heroTitle =
    document.getElementById(
        "heroTitle"
    );

const heroDescription =
    document.getElementById(
        "heroDescription"
    );


let stations = [];

let currentStation = null;

let currentHLS = null;


/*
 * ============================================================
 * Escape HTML
 * ============================================================
 */

function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/*
 * ============================================================
 * Load configuration
 * ============================================================
 */

async function loadStations() {

    try {

        const response =
            await fetch(
                "/api/stations?" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "服务器 HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        if (!data.ok) {

            throw new Error(
                data.error ||
                "读取配置失败"
            );
        }


        stations =
            Array.isArray(
                data.stations
            )
                ? data.stations
                : [];


        if (data.site) {

            siteLogo.textContent =
                data.site.name ||
                "广播电台";

            heroTitle.textContent =
                data.site.title ||
                "在线广播";

            heroDescription.textContent =
                data.site.description ||
                "";
            

            document.title =
                data.site.title ||
                data.site.name ||
                "广播电台";
        }


        renderStations();


    } catch (error) {

        stationGrid.innerHTML = `

            <div class="message error">

                无法读取电台配置：

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

        stationCount.textContent =
            "加载失败";
    }
}


/*
 * ============================================================
 * Render
 * ============================================================
 */

function renderStations() {

    const keyword =
        searchInput.value
            .trim()
            .toLowerCase();


    const filtered =
        stations.filter(
            station => {

                const text =
                    (
                        station.name +
                        " " +
                        station.category +
                        " " +
                        station.description
                    ).toLowerCase();

                return text.includes(
                    keyword
                );
            }
        );


    stationCount.textContent =
        filtered.length +
        " 个电台";


    if (!filtered.length) {

        stationGrid.innerHTML = `

            <div class="message">

                没有找到相关电台

            </div>

        `;

        return;
    }


    stationGrid.innerHTML =
        filtered
            .map(
                station =>
                    stationCard(
                        station
                    )
            )
            .join("");


    document
        .querySelectorAll(
            ".station-card"
        )
        .forEach(card => {

            card.addEventListener(
                "click",
                () => {

                    const id =
                        card.dataset.id;

                    const station =
                        stations.find(
                            item =>
                                String(
                                    item.id
                                ) ===
                                String(id)
                        );

                    if (station) {

                        playStation(
                            station
                        );
                    }
                }
            );
        });


    updatePlayingCards();
}


/*
 * ============================================================
 * Card
 * ============================================================
 */

function stationCard(
    station
) {

    const id =
        escapeHTML(
            station.id
        );

    const name =
        escapeHTML(
            station.name
        );

    const category =
        escapeHTML(
            station.category ||
            "网络电台"
        );

    const description =
        escapeHTML(
            station.description ||
            "在线广播"
        );

    const type =
        String(
            station.type ||
            ""
        ).toUpperCase();


    return `

        <article
            class="card station-card"
            data-id="${id}"
        >

            <div class="cover">
                ♪
            </div>

            <div class="card-name">
                ${name}
            </div>

            <div class="card-category">
                ${category}
            </div>

            <div class="card-description">
                ${description}
            </div>

            <button
                class="play-button"
                type="button"
            >
                ▶ 播放 ${type}
            </button>

        </article>

    `;
}


/*
 * ============================================================
 * Build Worker HLS URL
 * ============================================================
 */

function workerHLSURL(
    source
) {

    return (
        "/api/hls?url=" +
        encodeURIComponent(
            source
        )
    );
}


/*
 * ============================================================
 * Native HLS test
 * ============================================================
 */

function supportsNativeHLS() {

    const test =
        document.createElement(
            "video"
        );

    return !!(
        test.canPlayType(
            "application/vnd.apple.mpegurl"
        ) ||
        test.canPlayType(
            "application/x-mpegURL"
        )
    );
}


/*
 * ============================================================
 * Play MP3
 * ============================================================
 */

async function playMP3(
    station
) {

    stopHLS();


    audio.src =
        station.url;


    audio.load();


    await audio.play();
}


/*
 * ============================================================
 * Play HLS
 * ============================================================
 */

async function playHLS(
    station
) {

    const url =
        workerHLSURL(
            station.url
        );


    /*
     * Safari / 原生 HLS
     */

    if (
        supportsNativeHLS()
    ) {

        stopHLS();


        audio.src =
            url;

        audio.load();

        await audio.play();

        return;
    }


    /*
     * Chrome / Firefox
     *
     * 使用内置 HLS 引擎。
     */

    await startBuiltInHLS(
        url
    );
}


/*
 * ============================================================
 * Minimal HLS engine
 *
 * 这里不依赖 npm。
 *
 * 对常见 AAC/TS HLS 做基础处理。
 * ============================================================
 */

async function startBuiltInHLS(
    playlistURL
) {

    stopHLS();


    playerStatus.textContent =
        "正在连接 HLS...";


    const response =
        await fetch(
            playlistURL,
            {
                cache:
                    "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            "HLS HTTP " +
            response.status
        );
    }


    const text =
        await response.text();


    /*
     * 直播 HLS 通常是 TS/AAC 分片。
     *
     * 浏览器 MediaSource 支持时，
     * 尝试建立 SourceBuffer。
     */

    if (
        !window.MediaSource
    ) {

        throw new Error(
            "当前浏览器不支持 MediaSource"
        );
    }


    const mimeTypes = [

        'audio/mp4; codecs="mp4a.40.2"',

        'audio/mpeg',

        'audio/aac'
    ];


    let mime = null;


    for (
        const candidate
        of mimeTypes
    ) {

        if (
            MediaSource.isTypeSupported(
                candidate
            )
        ) {

            mime = candidate;

            break;
        }
    }


    /*
     * 如果没有兼容 MIME，
     * 不能直接把 MPEG-TS 放进 SourceBuffer。
     */

    if (!mime) {

        throw new Error(
            "Chrome 无法直接解析此 HLS 音频格式"
        );
    }


    /*
     * 当前 Worker 已经把 playlist
     * 重写成代理地址。
     *
     * 读取第一个媒体分片。
     */

    const mediaURLs =
        extractMediaURLs(
            text,
            playlistURL
        );


    if (!mediaURLs.length) {

        throw new Error(
            "HLS 中没有找到媒体分片"
        );
    }


    /*
     * 对 AAC / MP4 类 HLS，
     * 使用 MediaSource。
     */

    const mediaSource =
        new MediaSource();


    currentHLS = {

        mediaSource,

        playlistURL,

        urls:
            mediaURLs,

        index: 0
    };


    const objectURL =
        URL.createObjectURL(
            mediaSource
        );


    audio.src =
        objectURL;


    mediaSource.addEventListener(
        "sourceopen",
        () => {

            try {

                const buffer =
                    mediaSource.addSourceBuffer(
                        mime
                    );


                currentHLS.buffer =
                    buffer;


                appendNextHLSSegment();

            } catch (error) {

                playerStatus.textContent =
                    error.message;
            }
        }
    );


    audio.load();


    await audio.play();
}


/*
 * ============================================================
 * Extract media URLs
 * ============================================================
 */

function extractMediaURLs(
    text,
    base
) {

    const result = [];


    for (
        const line
        of text.split(/\r?\n/)
    ) {

        const value =
            line.trim();


        if (
            !value ||
            value.startsWith("#")
        ) {

            continue;
        }


        try {

            result.push(
                new URL(
                    value,
                    location.origin
                ).toString()
            );

        } catch {}
    }


    return result;
}


/*
 * ============================================================
 * Append HLS segment
 * ============================================================
 */

async function appendNextHLSSegment() {

    if (!currentHLS) {
        return;
    }


    const state =
        currentHLS;


    if (
        state.index >=
        state.urls.length
    ) {

        /*
         * 直播 HLS：
         * 重新读取 playlist。
         */

        setTimeout(
            refreshHLSPlaylist,
            1000
        );

        return;
    }


    const url =
        state.urls[
            state.index++
        ];


    try {

        const response =
            await fetch(
                url
            );


        if (!response.ok) {

            throw new Error(
                "分片 HTTP " +
                response.status
            );
        }


        const data =
            await response.arrayBuffer();


        await waitForBuffer(
            state.buffer
        );


        state.buffer.appendBuffer(
            data
        );


        state.buffer.addEventListener(
            "updateend",
            appendNextHLSSegment,
            {
                once: true
            }
        );


    } catch (error) {

        playerStatus.textContent =
            "HLS 分片播放失败：" +
            error.message;
    }
}


/*
 * ============================================================
 * Wait SourceBuffer
 * ============================================================
 */

function waitForBuffer(
    buffer
) {

    return new Promise(
        resolve => {

            if (!buffer.updating) {

                resolve();

                return;
            }


            buffer.addEventListener(
                "updateend",
                resolve,
                {
                    once: true
                }
            );
        }
    );
}


/*
 * ============================================================
 * Refresh live playlist
 * ============================================================
 */

async function refreshHLSPlaylist() {

    if (!currentHLS) {
        return;
    }


    try {

        const response =
            await fetch(
                currentHLS.playlistURL +
                "&_=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {
            throw new Error();
        }


        const text =
            await response.text();


        const urls =
            extractMediaURLs(
                text,
                currentHLS.playlistURL
            );


        currentHLS.urls =
            urls;


        currentHLS.index = 0;


        appendNextHLSSegment();

    } catch {

        setTimeout(
            refreshHLSPlaylist,
            1500
        );
    }
}


/*
 * ============================================================
 * Stop HLS
 * ============================================================
 */

function stopHLS() {

    currentHLS = null;


    if (
        audio.src &&
        audio.src.startsWith(
            "blob:"
        )
    ) {

        URL.revokeObjectURL(
            audio.src
        );
    }
}


/*
 * ============================================================
 * Play Station
 * ============================================================
 */

async function playStation(
    station
) {

    currentStation =
        station;


    playerName.textContent =
        station.name;


    playerStatus.textContent =
        "正在连接...";


    playButton.textContent =
        "❚❚";


    updatePlayingCards();


    try {

        const type =
            String(
                station.type ||
                ""
            ).toLowerCase();


        if (
            type === "m3u8" ||
            /\.m3u8(?:\?|$)/i.test(
                station.url
            )
        ) {

            await playHLS(
                station
            );

        } else {

            await playMP3(
                station
            );
        }


        playerStatus.textContent =
            "正在播放";

        playButton.textContent =
            "❚❚";


    } catch (error) {

        console.error(
            error
        );


        playerStatus.textContent =
            "播放失败：" +
            error.message;


        playButton.textContent =
            "▶";
    }


    updatePlayingCards();
}


/*
 * ============================================================
 * Playing card state
 * ============================================================
 */

function updatePlayingCards() {

    document
        .querySelectorAll(
            ".station-card"
        )
        .forEach(card => {

            const playing =
                currentStation &&
                String(
                    currentStation.id
                ) ===
                String(
                    card.dataset.id
                );


            card.classList.toggle(
                "playing",
                !!playing
            );
        });
}


/*
 * ============================================================
 * Play / Pause
 * ============================================================
 */

playButton.addEventListener(
    "click",
    async () => {

        if (!currentStation) {
            return;
        }


        if (
            audio.paused
        ) {

            try {

                await audio.play();

                playButton.textContent =
                    "❚❚";

                playerStatus.textContent =
                    "正在播放";

            } catch (error) {

                playerStatus.textContent =
                    "播放失败：" +
                    error.message;
            }

        } else {

            audio.pause();

            playButton.textContent =
                "▶";

            playerStatus.textContent =
                "已暂停";
        }
    }
);


/*
 * ============================================================
 * Audio events
 * ============================================================
 */

audio.addEventListener(
    "playing",
    () => {

        playButton.textContent =
            "❚❚";

        if (currentStation) {

            playerStatus.textContent =
                "正在播放";
        }
    }
);


audio.addEventListener(
    "pause",
    () => {

        playButton.textContent =
            "▶";
    }
);


audio.addEventListener(
    "waiting",
    () => {

        if (currentStation) {

            playerStatus.textContent =
                "正在缓冲...";
        }
    }
);


audio.addEventListener(
    "stalled",
    () => {

        if (currentStation) {

            playerStatus.textContent =
                "网络缓冲中...";
        }
    }
);


audio.addEventListener(
    "error",
    () => {

        if (
            currentStation &&
            audio.error
        ) {

            playerStatus.textContent =
                "音频播放失败";
        }
    }
);


/*
 * ============================================================
 * Search
 * ============================================================
 */

searchInput.addEventListener(
    "input",
    renderStations
);


/*
 * ============================================================
 * Initial
 * ============================================================
 */

loadStations();


/*
 * ============================================================
 * Refresh config every 30 seconds
 * ============================================================
 */

setInterval(
    loadStations,
    30000
);

</script>

</body>

</html>
