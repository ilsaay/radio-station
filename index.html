<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff">
<title>在线广播</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 亮色主题 */
:root{
  --bg:#f8f9fa;
  --surface:#fff;
  --surface-2:#f1f3f4;
  --surface-3:#e8eaed;
  --on-surface:#202124;
  --on-surface-variant:#5f6368;
  --outline:#dadce0;
  --primary:#1a73e8;
  --primary-hover:#1765cc;
  --error:#d93025;
  --shadow-1:0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
  --shadow-2:0 1px 3px 0 rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);
  --shadow-3:0 4px 4px 0 rgba(60,64,67,.3),0 8px 12px 6px rgba(60,64,67,.15);
  --radius:28px;
  --radius-sm:16px;
}

/* 暗色主题 */
html[data-theme="dark"]{
  --bg:#202124;
  --surface:#292a2d;
  --surface-2:#303134;
  --surface-3:#3c4043;
  --on-surface:#e8eaed;
  --on-surface-variant:#9aa0a6;
  --outline:#3c4043;
  --primary:#8ab4f8;
  --primary-hover:#aecbfa;
  --error:#f28b82;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,.5),0 1px 3px 1px rgba(0,0,0,.35);
  --shadow-2:0 1px 3px 0 rgba(0,0,0,.5),0 4px 8px 3px rgba(0,0,0,.35);
  --shadow-3:0 4px 4px 0 rgba(0,0,0,.5),0 8px 12px 6px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html,body{
  margin:0;
  background:var(--bg);
  color:var(--on-surface);
  font-family:"Google Sans","Roboto",Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease, color .25s ease;
}
body{padding:0 0 120px}

/* 顶栏 */
header{
  position:sticky;top:0;z-index:20;
  padding:18px 32px 14px;
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:blur(16px);
  border-bottom:1px solid transparent;
  transition:border-color .2s ease, box-shadow .2s ease, background .25s ease;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
}
header.scrolled{border-color:var(--outline);box-shadow:0 1px 2px rgba(60,64,67,.1)}
header .titles{min-width:0}
header h1{
  margin:0;
  font-size:22px;
  font-weight:500;
  letter-spacing:-.01em;
  color:var(--on-surface);
}
header p{
  margin:6px 0 0;
  color:var(--on-surface-variant);
  font-size:14px;
  font-weight:400;
}

/* 主题切换按钮 */
.theme-btn{
  width:44px;height:44px;border-radius:50%;
  border:1px solid var(--outline);
  background:var(--surface);
  color:var(--on-surface);
  display:grid;place-items:center;
  cursor:pointer;flex:0 0 auto;
  transition:background .2s ease, border-color .2s ease, transform .12s ease;
}
.theme-btn:hover{background:var(--surface-2)}
.theme-btn:active{transform:scale(.94)}
.theme-btn svg{width:20px;height:20px}
.theme-btn .icon-sun{display:none}
.theme-btn .icon-moon{display:block}
html[data-theme="dark"] .theme-btn .icon-sun{display:block}
html[data-theme="dark"] .theme-btn .icon-moon{display:none}

/* 内容区 */
main{max-width:1200px;margin:0 auto;padding:20px 32px 24px}

/* 卡片网格 */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:20px;
}

/* 方块卡片 */
.card{
  position:relative;
  aspect-ratio:1/1;
  border-radius:var(--radius);
  background:var(--surface);
  border:1px solid var(--outline);
  cursor:pointer;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:18px;
  transition:box-shadow .2s ease, transform .2s ease, border-color .2s ease, background .25s ease;
  box-shadow:var(--shadow-1);
}
.card:hover{
  box-shadow:var(--shadow-2);
  transform:translateY(-2px);
  border-color:transparent;
}
.card:active{
  box-shadow:var(--shadow-1);
  transform:translateY(0);
}
.card.playing{
  border-color:var(--primary);
  box-shadow:0 0 0 2px var(--primary),var(--shadow-2);
}

/* 卡片里的装饰音波 */
.card .wave{
  position:absolute;top:16px;right:16px;
  display:flex;align-items:flex-end;gap:3px;height:18px;
  opacity:.35;
}
.card .wave span{
  width:3px;background:var(--primary);border-radius:2px;
  animation:wave 1.1s ease-in-out infinite;
}
.card .wave span:nth-child(1){height:60%;animation-delay:0s}
.card .wave span:nth-child(2){height:100%;animation-delay:.15s}
.card .wave span:nth-child(3){height:45%;animation-delay:.3s}
.card .wave span:nth-child(4){height:80%;animation-delay:.45s}
.card.playing .wave{opacity:1}
@keyframes wave{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1.15)}}

/* 卡片文字 */
.card .name{
  font-size:15px;
  font-weight:500;
  letter-spacing:-.005em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--on-surface);
}
.card .sub{
  margin-top:4px;
  font-size:12px;
  color:var(--on-surface-variant);
  font-weight:400;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  min-height:15px;
}

/* LIVE 标签 */
.card .live{
  position:absolute;top:16px;left:16px;
  font-size:11px;
  font-weight:500;
  letter-spacing:.04em;
  color:#fff;
  background:var(--error);
  border-radius:8px;
  padding:3px 8px;
  opacity:0;
  transform:scale(.9);
  transition:opacity .2s ease, transform .2s ease;
}
html[data-theme="dark"] .card .live{color:#202124}
.card.playing .live{opacity:1;transform:scale(1)}

/* 空状态 */
.empty{
  padding:72px 24px;
  text-align:center;
  color:var(--on-surface-variant);
  border:1px dashed var(--outline);
  border-radius:var(--radius-sm);
  font-size:14px;
}

/* 状态栏 */
.status-bar{
  max-width:1200px;
  margin:8px auto 0;
  padding:0 32px;
  color:var(--on-surface-variant);
  font-size:12px;
}

/* 底部播放条 */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  height:96px;
  background:color-mix(in srgb, var(--bg) 96%, transparent);
  border-top:1px solid var(--outline);
  backdrop-filter:blur(20px);
  display:flex;
  align-items:center;
  gap:20px;
  padding:0 28px;
  box-shadow:0 -1px 2px rgba(60,64,67,.08);
  transition:background .25s ease, border-color .25s ease;
}
.bar .info{flex:1;min-width:0}
.bar .title{
  font-size:14px;
  font-weight:500;
  color:var(--on-surface);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.bar .sub{
  font-size:12px;
  color:var(--on-surface-variant);
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* 播放按钮 */
.bar .play{
  width:56px;
  height:56px;
  border-radius:50%;
  border:0;
  background:var(--primary);
  color:#fff;
  display:grid;
  place-items:center;
  cursor:pointer;
  flex:0 0 auto;
  transition:background .2s ease, box-shadow .2s ease, transform .12s ease;
  box-shadow:var(--shadow-2);
}
html[data-theme="dark"] .bar .play{color:#202124}
.bar .play:hover{background:var(--primary-hover);box-shadow:var(--shadow-3)}
.bar .play:active{transform:scale(.94);box-shadow:var(--shadow-1)}
.bar .play:disabled{opacity:.38;cursor:default;box-shadow:none;background:var(--surface-3);color:var(--on-surface-variant)}
.bar .play svg{width:24px;height:24px;fill:currentColor}

/* 音量 */
.volume{
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--on-surface-variant);
  flex:0 0 auto;
}
.volume svg{width:20px;height:20px;flex:0 0 auto}
.volume input{
  -webkit-appearance:none;
  appearance:none;
  width:130px;
  height:4px;
  border-radius:2px;
  background:linear-gradient(to right,var(--primary) var(--v,80%),var(--surface-3) var(--v,80%));
  outline:none;
  cursor:pointer;
  transition:background .15s ease;
}
.volume input::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:16px;
  height:16px;
  border-radius:50%;
  background:var(--primary);
  border:2px solid var(--surface);
  box-shadow:0 1px 3px rgba(60,64,67,.3);
  transition:transform .12s ease;
}
.volume input::-webkit-slider-thumb:hover{transform:scale(1.15)}
.volume input::-moz-range-thumb{
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--primary);
  border:2px solid var(--surface);
  box-shadow:0 1px 3px rgba(60,64,67,.3);
}
.volume .pct{
  font-size:12px;
  color:var(--on-surface-variant);
  width:34px;
  text-align:right;
  font-variant-numeric:tabular-nums;
}

/* 响应式 */
@media(max-width:700px){
  header{padding:16px 16px 12px}
  header h1{font-size:20px}
  main{padding:12px 16px 16px}
  .status-bar{padding:0 16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .card{border-radius:20px;padding:14px}
  .card .name{font-size:13.5px}
  .bar{height:88px;padding:0 16px;gap:12px}
  .bar .play{width:50px;height:50px}
  .volume input{width:80px}
  .volume .pct{display:none}
}
</style>
</head>
<body>
<header id="topbar">
  <div class="titles">
    <h1 id="siteName">在线广播</h1>
    <p id="siteDesc"></p>
  </div>
  <button class="theme-btn" id="themeBtn" aria-label="切换主题">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
  </button>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<div class="status-bar" id="status">加载中…</div>

<div class="bar">
  <div class="info">
    <div class="title" id="nowName">未选择电台</div>
    <div class="sub" id="nowSub">点击上方方块开始播放</div>
  </div>

  <button class="play" id="playBtn" disabled aria-label="播放/暂停">
    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>

  <div class="volume">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 10v4h4l5 4V6l-5 4H4Z"/>
      <path d="M17 9a4 4 0 0 1 0 6"/>
    </svg>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="音量">
    <span class="pct" id="volPct">80%</span>
  </div>
</div>

<audio id="audio" preload="none"></audio>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const audio = $('audio');
const state = { stations: [], current: null, hls: null };

const setStatus = t => { $('status').textContent = t; };

function proxied(url) {
  return location.origin + '/proxy?url=' + encodeURIComponent(url);
}

function playIcon(playing) {
  $('playIcon').innerHTML = playing
    ? '<path d="M7 5h3v14H7zm7 0h3v14h-3z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------- 主题 ---------- */
const THEME_KEY = 'radio-theme';
const themeBtn = $('themeBtn');
const mql = window.matchMedia('(prefers-color-scheme: dark)');

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#202124' : '#ffffff');
}

function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  const theme = saved || (mql.matches ? 'dark' : 'light');
  applyTheme(theme);
}

themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
};

mql.addEventListener('change', e => {
  if (!localStorage.getItem(THEME_KEY)) applyTheme(e.matches ? 'dark' : 'light');
});

initTheme();

/* ---------- 配置 ---------- */
async function loadConfig() {
  setStatus('加载配置…');
  try {
    const r = await fetch('/api/stations?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    state.stations = (data.stations || []).filter(s => s.url);
    if (data.site) {
      if (data.site.name) { $('siteName').textContent = data.site.name; document.title = data.site.name; }
      if (data.site.description) $('siteDesc').textContent = data.site.description;
    }
    render();
    setStatus(state.stations.length ? '就绪' : '配置里没有可用电台');
  } catch (e) {
    $('grid').innerHTML = '<div class="empty">读取配置失败：' + e.message + '</div>';
    setStatus('配置错误');
  }
}

function render() {
  if (!state.stations.length) {
    $('grid').innerHTML = '<div class="empty">没有电台</div>';
    return;
  }
  $('grid').innerHTML = state.stations.map((s, i) => {
    const playing = state.current === s && !audio.paused;
    return `<div class="card ${playing ? 'playing' : ''}" data-i="${i}">
      <span class="live">LIVE</span>
      <div class="wave"><span></span><span></span><span></span><span></span></div>
      <div class="name">${esc(s.name)}</div>
      <div class="sub">${esc(s.category || s.description || '')}</div>
    </div>`;
  }).join('');
  for (const el of $('grid').querySelectorAll('.card')) {
    el.onclick = () => playStation(state.stations[+el.dataset.i]);
  }
}

function destroyHls() {
  if (state.hls) { try { state.hls.destroy(); } catch {} state.hls = null; }
}

function setNow(s) {
  $('nowName').textContent = s ? s.name : '未选择电台';
  $('nowSub').textContent = s ? (s.description || s.category || 'LIVE') : '点击上方方块开始播放';
  $('playBtn').disabled = !s;
}

async function tryPlay() {
  try { await audio.play(); setStatus('播放中'); playIcon(true); render(); }
  catch { setStatus('点击播放按钮开始'); playIcon(false); }
}

function isHls(s) {
  return (s.type || '').toLowerCase() === 'm3u8' || /\.m3u8(\?|$)/i.test(s.url);
}

function playStation(s) {
  if (!s) return;
  state.current = s;
  destroyHls();
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  setNow(s);
  render();

  const src = proxied(s.url);
  setStatus('连接中…');

  if (isHls(s)) {
    if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({ enableWorker: true, lowLatencyMode: false });
      state.hls = hls;
      hls.on(Hls.Events.MANIFEST_PARSED, () => tryPlay());
      hls.on(Hls.Events.ERROR, (_, d) => {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
          setStatus('网络错误：' + d.details);
          hls.destroy(); state.hls = null;
        } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) {
          setStatus('媒体错误，尝试恢复…');
          hls.recoverMediaError();
        } else {
          setStatus('播放失败：' + d.details);
          hls.destroy(); state.hls = null;
        }
      });
      hls.loadSource(src);
      hls.attachMedia(audio);
    } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
      audio.src = src;
      audio.onloadedmetadata = () => tryPlay();
    } else {
      setStatus('浏览器不支持 HLS');
    }
  } else {
    audio.src = src;
    audio.onloadedmetadata = () => tryPlay();
  }
}

$('playBtn').onclick = () => {
  if (!state.current) return;
  if (audio.paused) tryPlay(); else audio.pause();
};

/* 音量 */
const vol = $('volume');
const volPct = $('volPct');
function syncVolume() {
  const v = parseFloat(vol.value);
  audio.volume = v;
  vol.style.setProperty('--v', (v * 100) + '%');
  volPct.textContent = Math.round(v * 100) + '%';
}
vol.addEventListener('input', syncVolume);
syncVolume();

audio.addEventListener('playing', () => { setStatus('播放中'); playIcon(true); render(); });
audio.addEventListener('pause', () => { playIcon(false); render(); });
audio.addEventListener('waiting', () => setStatus('缓冲中…'));
audio.addEventListener('error', () => setStatus('播放出错'));

/* 顶栏滚动阴影 */
const topbar = $('topbar');
window.addEventListener('scroll', () => {
  topbar.classList.toggle('scrolled', window.scrollY > 4);
}, { passive: true });

loadConfig();
</script>
</body>
</html>
