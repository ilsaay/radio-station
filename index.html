<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>广播电台 · 随时随地，开始收听</title>
<style>
  :root{
    --brand:#4f46e5;
    --brand-2:#7c3aed;
    --brand-soft:#eef2ff;
    --text:#0f172a;
    --text-sub:#64748b;
    --border:#e2e8f0;
    --bg:#f8fafc;
    --card:#ffffff;
    --radius:16px;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06);
    --shadow-md:0 8px 24px rgba(15,23,42,.08);
    --shadow-lg:0 20px 40px rgba(15,23,42,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;color:var(--text);background:var(--bg);
    line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  .topbar{
    background:rgba(255,255,255,.85);
    backdrop-filter:saturate(180%) blur(12px);
    position:sticky;top:0;z-index:50;
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:1240px;margin:0 auto;height:68px;
    display:flex;align-items:center;gap:36px;padding:0 24px;
  }
  .logo{
    display:flex;align-items:center;gap:10px;
    font-size:19px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;
  }
  .logo .mark{
    width:32px;height:32px;border-radius:9px;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:16px;box-shadow:0 4px 12px rgba(79,70,229,.35);
  }
  .nav{display:flex;gap:28px;font-size:15px}
  .nav a{color:var(--text-sub);font-weight:500;transition:color .15s}
  .nav a:hover{color:var(--text)}
  .nav a.active{color:var(--brand)}

  .search{
    margin-left:auto;display:flex;align-items:center;
    background:var(--bg);border:1px solid var(--border);
    border-radius:999px;padding:0 4px 0 18px;width:320px;height:42px;
    transition:border-color .2s,box-shadow .2s,background .2s;
  }
  .search:focus-within{
    background:#fff;border-color:var(--brand);
    box-shadow:0 0 0 4px var(--brand-soft);
  }
  .search input{flex:1;border:0;outline:0;background:transparent;font-size:14px;color:var(--text)}
  .search input::placeholder{color:var(--text-sub)}
  .search button{
    border:0;cursor:pointer;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    color:#fff;height:34px;padding:0 18px;border-radius:999px;
    font-size:13px;font-weight:600;transition:opacity .15s;
  }
  .search button:hover{opacity:.9}

  .banner{max-width:1240px;margin:28px auto 0;padding:0 24px}
  .banner-inner{
    border-radius:22px;padding:44px 48px;color:#fff;
    background:
      radial-gradient(1000px 300px at 0% 0%, rgba(255,255,255,.18), transparent 60%),
      linear-gradient(120deg,#4f46e5,#7c3aed 55%,#9333ea);
    box-shadow:var(--shadow-lg);
    position:relative;overflow:hidden;
  }
  .banner-inner::after{
    content:"";position:absolute;right:-60px;top:-60px;
    width:260px;height:260px;border-radius:50%;
    background:rgba(255,255,255,.08);
  }
  .banner h1{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:10px}
  .banner p{opacity:.9;font-size:15px;max-width:640px}

  .container{max-width:1240px;margin:0 auto;padding:36px 24px 120px}
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;margin:8px 0 20px}
  .section-head h2{font-size:20px;font-weight:800;letter-spacing:-.3px}
  .section-head .hint{font-size:13px;color:var(--text-sub)}

  .filters{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px 22px;margin-bottom:24px;
    box-shadow:var(--shadow-sm);
  }
  .filter-row{display:flex;padding:8px 0;font-size:13px;line-height:28px}
  .filter-row + .filter-row{border-top:1px solid var(--border)}
  .filter-label{color:var(--text-sub);width:60px;flex-shrink:0;font-weight:500}
  .filter-items{flex:1;display:flex;flex-wrap:wrap;gap:6px}
  .filter-items a{padding:3px 12px;border-radius:999px;color:#475569;transition:background .15s,color .15s}
  .filter-items a:hover{background:var(--bg);color:var(--text)}
  .filter-items a.active{background:var(--brand-soft);color:var(--brand);font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:26px 20px}
  .card{display:block;cursor:pointer}
  .card .thumb{
    position:relative;width:100%;aspect-ratio:1/1;
    border-radius:var(--radius);overflow:hidden;background:#fff;
    box-shadow:var(--shadow-sm);
    transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;
  }
  .card:hover .thumb{transform:translateY(-5px);box-shadow:var(--shadow-md)}
  .card .thumb img{width:100%;height:100%;object-fit:cover}
  .card .thumb .placeholder{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:14px;font-size:17px;font-weight:800;line-height:1.35;
    color:var(--brand);background:linear-gradient(135deg,#eef2ff,#e0e7ff);
  }
  .card .badge{
    position:absolute;top:10px;left:10px;
    display:flex;align-items:center;gap:5px;
    background:rgba(15,23,42,.72);color:#fff;
    font-size:11px;font-weight:600;
    padding:3px 9px;border-radius:999px;backdrop-filter:blur(6px);
  }
  .card .badge i{width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .card .type{
    position:absolute;bottom:10px;right:10px;
    background:rgba(79,70,229,.92);color:#fff;
    font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;
    text-transform:uppercase;letter-spacing:.4px;
  }
  .card .name{margin-top:12px;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .15s}
  .card:hover .name{color:var(--brand)}
  .card .sub{font-size:12px;color:var(--text-sub);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .status{text-align:center;color:var(--text-sub);padding:60px 0}
  .empty{grid-column:1/-1}

  .player{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:rgba(255,255,255,.92);
    backdrop-filter:saturate(180%) blur(14px);
    border-top:1px solid var(--border);
    padding:12px 24px;display:none;align-items:center;gap:18px;
    box-shadow:0 -8px 30px rgba(15,23,42,.08);
  }
  .player.show{display:flex}
  .player .cover{
    width:44px;height:44px;border-radius:10px;flex-shrink:0;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;
    overflow:hidden;
  }
  .player .cover img{width:100%;height:100%;object-fit:cover}
  .player .info{flex:1;min-width:0}
  .player .info .t{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .player .info .s{font-size:12px;color:var(--text-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .player audio{height:38px;max-width:420px}
  .player .close{
    border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;
    font-size:16px;color:var(--text-sub);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,color .15s;
  }
  .player .close:hover{background:#eef2f7;color:var(--text)}

  .footer{border-top:1px solid var(--border);background:#fff;padding:28px 24px;text-align:center;color:var(--text-sub);font-size:13px}

  @media(max-width:1080px){.grid{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:760px){
    .grid{grid-template-columns:repeat(3,1fr)}
    .search{width:200px}
    .nav{display:none}
    .banner-inner{padding:32px 28px}
    .banner h1{font-size:22px}
  }
  @media(max-width:520px){
    .grid{grid-template-columns:repeat(2,1fr);gap:18px 14px}
    .search{display:none}
    .player audio{max-width:180px}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <span class="mark">♫</span>
      <span id="siteName">广播电台</span>
    </div>
    <div class="nav">
      <a href="#" class="active">发现</a>
      <a href="#">电台</a>
      <a href="#">分类</a>
    </div>
    <div class="search">
      <input type="text" id="kw" placeholder="搜索电台 / 分类">
      <button onclick="doSearch()">搜索</button>
    </div>
  </div>
</div>

<div class="banner">
  <div class="banner-inner">
    <h1 id="siteTitle">随时随地，开始收听。</h1>
    <p id="siteDesc">从音乐、新闻到网络广播，把你喜欢的声音集中到一个简单的播放器里。</p>
  </div>
</div>

<div class="container">
  <div class="section-head">
    <h2 id="listTitle">全部电台</h2>
    <span class="hint" id="count"></span>
  </div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</div>

<div class="player" id="player">
  <div class="cover" id="pCover">♫</div>
  <div class="info">
    <div class="t" id="pTitle">—</div>
    <div class="s" id="pSub"></div>
  </div>
  <audio id="audio" controls autoplay></audio>
  <button class="close" onclick="closePlayer()">✕</button>
</div>

<div class="footer">© 2026 <span id="footName">广播电台</span> · 仅供学习交流使用</div>

<script src="app.js"></script>
</body>
</html>
