<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>在线广播</title>

<meta name="theme-color" content="#0f0f0f">

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#0f0f0f;
    color:#fff;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    overflow-x:hidden;
    padding-bottom:90px;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

svg{
    display:block;
}

/* =========================
   APP
========================= */

.app{
    min-height:100vh;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    position:fixed;
    z-index:100;
    left:0;
    right:0;
    top:0;

    height:64px;

    display:flex;
    align-items:center;

    padding:0 24px;

    background:rgba(15,15,15,.94);

    backdrop-filter:blur(20px);

    border-bottom:1px solid #272727;
}

.logo{
    width:220px;

    display:flex;
    align-items:center;

    gap:12px;

    font-size:20px;
    font-weight:800;

    color:white;

    text-decoration:none;
}

.logo-icon{
    width:34px;
    height:34px;

    border-radius:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#ff0033;
}

.logo-icon svg{
    width:19px;
    height:19px;

    fill:white;
}

.search-box{
    flex:1;

    max-width:650px;

    position:relative;

    margin:auto;
}

.search-box input{
    width:100%;
    height:42px;

    border-radius:22px;

    border:1px solid #303030;

    outline:none;

    background:#1f1f1f;

    color:white;

    padding:0 48px;

    font-size:14px;
}

.search-box input:focus{
    border-color:#555;
    background:#242424;
}

.search-icon{
    position:absolute;

    left:17px;
    top:12px;

    width:18px;
    height:18px;

    color:#aaa;
}

.top-right{
    width:220px;

    display:flex;

    justify-content:flex-end;

    gap:8px;
}

.circle-button{
    width:40px;
    height:40px;

    border-radius:50%;

    background:transparent;

    color:#ccc;

    display:flex;
    align-items:center;
    justify-content:center;
}

.circle-button:hover{
    background:#272727;
    color:white;
}

.circle-button svg{
    width:20px;
    height:20px;
}

/* =========================
   LAYOUT
========================= */

.layout{
    display:flex;

    padding-top:64px;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    position:fixed;

    left:0;
    top:64px;
    bottom:90px;

    width:220px;

    padding:20px 12px;

    border-right:1px solid #272727;

    background:#0f0f0f;

    overflow-y:auto;
}

.side-title{
    padding:14px 12px 8px;

    font-size:11px;

    color:#777;

    text-transform:uppercase;

    letter-spacing:.12em;
}

.nav{
    width:100%;

    display:flex;

    align-items:center;

    gap:14px;

    padding:11px 13px;

    margin:2px 0;

    border-radius:9px;

    background:transparent;

    color:#aaa;

    text-align:left;

    font-size:14px;
}

.nav:hover{
    background:#202020;
    color:#fff;
}

.nav.active{
    background:#272727;
    color:white;
    font-weight:700;
}

.nav svg{
    width:19px;
    height:19px;

    flex-shrink:0;
}

/* =========================
   MAIN
========================= */

.main{
    margin-left:220px;

    width:calc(100% - 220px);

    padding:30px 36px 120px;

    max-width:1600px;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:300px;

    border-radius:20px;

    position:relative;

    overflow:hidden;

    display:flex;

    align-items:flex-end;

    padding:38px;

    margin-bottom:35px;

    background:
        radial-gradient(
            circle at 80% 15%,
            rgba(255,0,51,.35),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #252525,
            #141414 60%,
            #101010
        );
}

.hero::before{
    content:"";

    position:absolute;

    width:480px;
    height:480px;

    right:-180px;
    bottom:-300px;

    border-radius:50%;

    border:70px solid rgba(255,255,255,.025);
}

.hero-content{
    position:relative;

    z-index:2;

    max-width:720px;
}

.hero-label{
    color:#ff1744;

    font-size:12px;

    font-weight:800;

    letter-spacing:.18em;

    text-transform:uppercase;
}

.hero h1{
    font-size:46px;

    line-height:1.05;

    letter-spacing:-.045em;

    margin:13px 0;

    max-width:680px;
}

.hero p{
    margin:0;

    color:#aaa;

    font-size:14px;

    line-height:1.7;

    max-width:650px;
}

.hero-play{
    margin-top:24px;

    display:inline-flex;

    align-items:center;

    gap:9px;

    padding:11px 20px;

    border-radius:24px;

    background:white;

    color:#111;

    font-weight:750;
}

.hero-play:hover{
    transform:translateY(-1px);
}

/* =========================
   SECTION
========================= */

.section{
    margin-top:34px;
}

.section-header{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:17px;
}

.section-header h2{
    margin:0;

    font-size:21px;

    letter-spacing:-.025em;
}

.section-header span{
    color:#777;

    font-size:12px;
}

/* =========================
   CATEGORY
========================= */

.categories{
    display:flex;

    gap:9px;

    overflow-x:auto;

    padding-bottom:5px;

    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex-shrink:0;

    padding:8px 15px;

    border-radius:20px;

    border:1px solid #303030;

    background:#171717;

    color:#aaa;

    font-size:13px;
}

.category:hover{
    background:#242424;
    color:white;
}

.category.active{
    background:white;
    color:#111;
    border-color:white;
}

/* =========================
   RADIO GRID
========================= */

.radio-grid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(190px,1fr)
        );

    gap:23px 18px;
}

/* =========================
   RADIO CARD
========================= */

.radio-card{
    min-width:0;

    cursor:pointer;
}

.cover{
    position:relative;

    aspect-ratio:1;

    overflow:hidden;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #242424,
            #111
        );

    box-shadow:
        0 10px 35px rgba(0,0,0,.25);
}

.cover::after{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.65),
            transparent 50%
        );

    pointer-events:none;
}

.cover img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.default-cover{
    width:100%;
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 30% 20%,
            #555,
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #303030,
            #101010
        );
}

.default-cover svg{
    width:55px;
    height:55px;

    color:#ddd;
}

.live{
    position:absolute;

    z-index:3;

    left:10px;
    top:10px;

    padding:4px 7px;

    border-radius:5px;

    background:#ff1744;

    color:white;

    font-size:9px;

    font-weight:900;

    letter-spacing:.08em;
}

.card-play{
    position:absolute;

    z-index:5;

    right:11px;
    bottom:11px;

    width:44px;
    height:44px;

    border-radius:50%;

    background:white;

    color:#111;

    display:flex;

    align-items:center;
    justify-content:center;

    opacity:0;

    transform:translateY(7px);

    transition:.18s;

    box-shadow:0 8px 25px rgba(0,0,0,.4);
}

.radio-card:hover .card-play,
.radio-card.playing .card-play{
    opacity:1;
    transform:none;
}

.card-play svg{
    width:20px;
    height:20px;

    fill:currentColor;
}

.card-info{
    padding:11px 3px;
}

.card-title{
    font-size:14px;

    font-weight:700;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.card-desc{
    margin-top:5px;

    color:#777;

    font-size:12px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

/* =========================
   EMPTY
========================= */

.empty{
    grid-column:1/-1;

    padding:70px 20px;

    text-align:center;

    color:#666;

    border:1px dashed #333;

    border-radius:16px;
}

/* =========================
   PLAYER
========================= */

.player{
    position:fixed;

    z-index:200;

    left:0;
    right:0;
    bottom:0;

    height:90px;

    display:grid;

    grid-template-columns:
        minmax(250px,1fr)
        auto
        minmax(250px,1fr);

    align-items:center;

    gap:25px;

    padding:0 25px;

    background:rgba(20,20,20,.97);

    border-top:1px solid #303030;

    backdrop-filter:blur(20px);
}

/* now playing */

.now-playing{
    display:flex;

    align-items:center;

    min-width:0;

    gap:12px;
}

.now-cover{
    width:58px;
    height:58px;

    flex-shrink:0;

    border-radius:9px;

    overflow:hidden;

    background:#292929;

    display:flex;

    align-items:center;
    justify-content:center;
}

.now-cover img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.now-cover svg{
    width:25px;
    height:25px;
}

.now-info{
    min-width:0;
}

.now-name{
    font-size:13px;

    font-weight:750;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.now-desc{
    margin-top:4px;

    font-size:11px;

    color:#777;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.favorite{
    width:34px;
    height:34px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:transparent;

    color:#777;
}

.favorite:hover{
    color:white;
}

.favorite.active{
    color:#ff1744;
}

.favorite svg{
    width:18px;
    height:18px;
}

/* controls */

.player-controls{
    display:flex;

    align-items:center;

    gap:8px;
}

.player-btn{
    width:38px;
    height:38px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#ccc;

    background:transparent;
}

.player-btn:hover{
    background:#282828;
    color:white;
}

.player-btn svg{
    width:19px;
    height:19px;

    fill:currentColor;
}

.player-main{
    width:49px;
    height:49px;

    border-radius:50%;

    background:white;

    color:#111;

    display:flex;

    align-items:center;
    justify-content:center;
}

.player-main:hover{
    transform:scale(1.04);
}

.player-main svg{
    width:22px;
    height:22px;

    fill:currentColor;
}

/* right */

.player-right{
    display:flex;

    align-items:center;

    justify-content:flex-end;

    gap:13px;
}

.live-status{
    padding:5px 9px;

    border:1px solid #333;

    border-radius:12px;

    color:#777;

    font-size:10px;
}

.volume{
    display:flex;

    align-items:center;

    gap:8px;

    color:#aaa;
}

.volume svg{
    width:18px;
    height:18px;
}

.volume input{
    width:105px;

    accent-color:white;
}

/* =========================
   MOBILE
========================= */

@media(max-width:1000px){

    .logo{
        width:auto;
    }

    .logo span:last-child{
        display:none;
    }

    .top-right{
        width:auto;
    }

    .sidebar{
        display:none;
    }

    .main{
        margin-left:0;

        width:100%;

        padding-left:20px;
        padding-right:20px;
    }

    .player{
        grid-template-columns:1fr auto;

        height:78px;

        padding:0 14px;
    }

    .player-right{
        display:none;
    }

    .now-cover{
        width:50px;
        height:50px;
    }

}

@media(max-width:600px){

    .topbar{
        padding:0 12px;
        gap:10px;
    }

    .search-box{
        max-width:none;
    }

    .hero{
        min-height:270px;

        padding:25px;
    }

    .hero h1{
        font-size:32px;
    }

    .main{
        padding:
            20px
            13px
            110px;
    }

    .radio-grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:16px 12px;
    }

    .card-play{
        opacity:1;
        transform:none;
        width:38px;
        height:38px;
    }

    .player{
        grid-template-columns:minmax(0,1fr) auto;
    }

    .favorite{
        display:none;
    }

    .player-controls{
        gap:2px;
    }

    .player-btn:first-child,
    .player-btn:last-child{
        display:none;
    }

    .player-main{
        width:45px;
        height:45px;
    }

}

</style>
</head>

<body>

<div class="app">

<!-- =========================
     TOP
========================= -->

<header class="topbar">

    <a class="logo" href="#">

        <span class="logo-icon">

            <svg viewBox="0 0 24 24">
                <path d="M12 3a9 9 0 1 0 9 9h-3a6 6 0 1 1-6-6V3Z"/>
                <path d="M12 7a5 5 0 1 1-5 5h3a2 2 0 1 0 2-2V7Z"/>
            </svg>

        </span>

        <span id="brandName">
            在线广播
        </span>

    </a>


    <div class="search-box">

        <svg
            class="search-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

            <circle cx="11" cy="11" r="7"/>

            <path d="m20 20-4-4"/>

        </svg>

        <input
            id="search"
            type="search"
            placeholder="搜索电台、音乐、分类…">

    </div>


    <div class="top-right">

        <button
            class="circle-button"
            id="refresh"
            title="刷新">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <path
                    d="M20 11a8 8 0 0 0-15-4"/>

                <path
                    d="M4 4v5h5"/>

                <path
                    d="M4 13a8 8 0 0 0 15 4"/>

                <path
                    d="M20 20v-5h-5"/>

            </svg>

        </button>


        <button
            class="circle-button"
            id="favoriteTop"
            title="我的收藏">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <path
                    d="M20.8 8.8c0 5.5-8.8 11-8.8 11S3.2 14.3 3.2 8.8A4.8 4.8 0 0 1 12 6.1a4.8 4.8 0 0 1 8.8 2.7Z"/>

            </svg>

        </button>

    </div>

</header>


<div class="layout">


<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

    <div class="side-title">
        浏览
    </div>

    <button
        class="nav active"
        id="navAll">

        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

            <path d="m4 10 8-7 8 7"/>
            <path d="M6 9v10h12V9"/>
            <path d="M10 19v-6h4v6"/>

        </svg>

        全部电台

    </button>


    <button
        class="nav"
        id="navFav">

        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

            <path
                d="M20.8 8.8c0 5.5-8.8 11-8.8 11S3.2 14.3 3.2 8.8A4.8 4.8 0 0 1 12 6.1a4.8 4.8 0 0 1 8.8 2.7Z"/>

        </svg>

        我的收藏

    </button>


    <div class="side-title">
        分类
    </div>

    <div id="sideCategories"></div>

</aside>


<!-- =========================
     MAIN
========================= -->

<main class="main">


<section class="hero">

    <div class="hero-content">

        <div class="hero-label">
            LIVE RADIO
        </div>

        <h1 id="heroTitle">
            随时随地，开始收听。
        </h1>

        <p id="heroDescription">
            从音乐、新闻到网络广播，
            把你喜欢的声音集中到一个简单的播放器里。
        </p>

        <button
            class="hero-play"
            id="heroPlay">

            <svg
                width="17"
                viewBox="0 0 24 24">

                <path
                    d="M8 5v14l11-7z"/>

            </svg>

            开始播放

        </button>

    </div>

</section>


<section class="section">

    <div class="section-header">

        <h2>
            浏览电台
        </h2>

        <span id="stationCount">
            0 个频道
        </span>

    </div>


    <div
        class="categories"
        id="categories">
    </div>


    <div
        class="radio-grid"
        id="radioGrid">

    </div>

</section>


</main>

</div>

</div>


<!-- =========================
     PLAYER
========================= -->

<div class="player">

    <div class="now-playing">

        <div
            class="now-cover"
            id="nowCover">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6">

                <circle
                    cx="12"
                    cy="12"
                    r="8"/>

                <path
                    d="M12 8v8M8 12h8"/>

            </svg>

        </div>


        <div class="now-info">

            <div
                class="now-name"
                id="nowName">

                未选择电台

            </div>

            <div
                class="now-desc"
                id="nowDesc">

                选择一个频道开始播放

            </div>

        </div>


        <button
            class="favorite"
            id="favoriteButton">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <path
                    d="M20.8 8.8c0 5.5-8.8 11-8.8 11S3.2 14.3 3.2 8.8A4.8 4.8 0 0 1 12 6.1a4.8 4.8 0 0 1 8.8 2.7Z"/>

            </svg>

        </button>

    </div>


    <div class="player-controls">

        <button
            class="player-btn"
            id="previous">

            <svg viewBox="0 0 24 24">

                <path d="M6 5h2v14H6z"/>
                <path d="M20 6v12l-9-6z"/>

            </svg>

        </button>


        <button
            class="player-main"
            id="playButton">

            <svg
                id="playIcon"
                viewBox="0 0 24 24">

                <path
                    d="M8 5v14l11-7z"/>

            </svg>

        </button>


        <button
            class="player-btn"
            id="next">

            <svg viewBox="0 0 24 24">

                <path d="M16 5h2v14h-2z"/>
                <path d="M4 6v12l9-6z"/>

            </svg>

        </button>

    </div>


    <div class="player-right">

        <span
            class="live-status"
            id="status">

            就绪

        </span>


        <div class="volume">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <path
                    d="M4 10v4h4l5 4V6l-5 4H4Z"/>

                <path
                    d="M17 9a4 4 0 0 1 0 6"/>

            </svg>


            <input
                id="volume"
                type="range"
                min="0"
                max="1"
                step=".01"
                value=".8">

        </div>

    </div>

</div>


<audio
    id="audio"
    playsinline
    preload="none">
</audio>


<!--
    HLS.js

    它运行在用户浏览器里。
    Cloudflare Worker 不转发音频。
-->

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js"></script>


<script>

"use strict";


/* =========================================================
   STATE
========================================================= */

const state = {

    stations: [],

    filtered: [],

    category: "全部",

    current: null,

    hls: null,

    favorites: new Set(
        JSON.parse(
            localStorage.getItem("radio-favorites") || "[]"
        )
    )

};


const audio =
    document.getElementById("audio");


const $ = id =>
    document.getElementById(id);


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function stationId(station){

    return station.url;

}


function saveFavorites(){

    localStorage.setItem(
        "radio-favorites",
        JSON.stringify(
            [...state.favorites]
        )
    );

}


function setStatus(text){

    $("status").textContent = text;

}


/* =========================================================
   DEFAULT COVER
========================================================= */

function defaultCover(){

    return `
        <div class="default-cover">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5">

                <circle
                    cx="12"
                    cy="12"
                    r="8"/>

                <path
                    d="M12 8v8"/>

                <path
                    d="M8 12h8"/>

            </svg>

        </div>
    `;

}


/* =========================================================
   CONFIG
========================================================= */

async function loadConfig(){

    setStatus("加载配置…");

    try{

        const response =
            await fetch(
                "/api/stations?time=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        state.stations =
            Array.isArray(data.stations)
                ? data.stations
                : [];


        if(data.site){

            $("brandName").textContent =
                data.site.name ||
                "在线广播";

            $("heroTitle").textContent =
                data.site.title ||
                "随时随地，开始收听。";

            $("heroDescription").textContent =
                data.site.description ||
                "从音乐、新闻到网络广播，把你喜欢的声音集中到一个简单的播放器里。";

            document.title =
                data.site.name ||
                "在线广播";

        }


        renderCategories();

        renderStations();

        setStatus("就绪");

    }
    catch(error){

        console.error(error);

        $("radioGrid").innerHTML = `

            <div class="empty">

                无法读取广播配置。

                <br><br>

                请检查 Cloudflare Worker
                与 GitHub config.ini。

            </div>

        `;

        setStatus("配置错误");

    }

}


/* =========================================================
   CATEGORIES
========================================================= */

function renderCategories(){

    const categories = [

        "全部",

        ...new Set(

            state.stations

                .map(s => s.category)

                .filter(Boolean)

        )

    ];


    $("categories").innerHTML =

        categories.map(category => `

            <button
                class="category ${
                    category === state.category
                        ? "active"
                        : ""
                }"
                onclick="selectCategory(${JSON.stringify(category)})">

                ${escapeHTML(category)}

            </button>

        `).join("");


    $("sideCategories").innerHTML =

        categories
            .filter(c => c !== "全部")
            .map(category => `

                <button
                    class="nav"
                    onclick="selectCategory(${JSON.stringify(category)})">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7">

                        <circle
                            cx="12"
                            cy="12"
                            r="8"/>

                        <path
                            d="M12 8v8M8 12h8"/>

                    </svg>

                    ${escapeHTML(category)}

                </button>

            `).join("");

}


function selectCategory(category){

    state.category =
        category;

    renderCategories();

    renderStations();

}


/* =========================================================
   RENDER STATIONS
========================================================= */

function renderStations(){

    const query =
        $("search")
            .value
            .trim()
            .toLowerCase();


    state.filtered =
        state.stations.filter(station => {

            const text =
                [
                    station.name,
                    station.category,
                    station.description
                ]
                .join(" ")
                .toLowerCase();


            const categoryOK =
                state.category === "全部" ||
                station.category === state.category;


            const queryOK =
                !query ||
                text.includes(query);


            const favoritesOK =
                state.category !== "收藏" ||
                state.favorites.has(
                    stationId(station)
                );


            return (
                categoryOK &&
                queryOK &&
                favoritesOK
            );

        });


    $("stationCount").textContent =
        state.filtered.length +
        " 个频道";


    if(!state.filtered.length){

        $("radioGrid").innerHTML = `

            <div class="empty">

                没有找到匹配的电台。

            </div>

        `;

        return;

    }


    $("radioGrid").innerHTML =

        state.filtered
            .map(station => {

                const playing =
                    state.current &&
                    stationId(state.current) ===
                    stationId(station) &&
                    !audio.paused;


                const cover =
                    station.cover
                        ? `
                            <img
                                src="${escapeHTML(station.cover)}"
                                alt=""
                                loading="lazy"
                                onerror="this.style.display='none'">
                          `
                        : defaultCover();


                return `

                    <article
                        class="radio-card ${
                            playing
                                ? "playing"
                                : ""
                        }"
                        data-url="${escapeHTML(station.url)}"
                        onclick="playStationByUrl(${JSON.stringify(station.url)})">


                        <div class="cover">

                            ${cover}


                            <span class="live">
                                LIVE
                            </span>


                            <button
                                class="card-play"
                                onclick="
                                    event.stopPropagation();
                                    playStationByUrl(${JSON.stringify(station.url)});
                                ">

                                <svg
                                    viewBox="0 0 24 24">

                                    <path
                                        d="${
                                            playing
                                            ? "M7 5h3v14H7zm7 0h3v14h-3z"
                                            : "M8 5v14l11-7z"
                                        }"/>

                                </svg>

                            </button>

                        </div>


                        <div class="card-info">

                            <div class="card-title">

                                ${escapeHTML(station.name)}

                            </div>


                            <div class="card-desc">

                                ${escapeHTML(
                                    station.category ||
                                    "网络广播"
                                )}

                                ${
                                    station.description
                                        ? " · " +
                                          escapeHTML(
                                              station.description
                                          )
                                        : ""
                                }

                            </div>

                        </div>

                    </article>

                `;

            })
            .join("");

}


/* =========================================================
   PLAYER UI
========================================================= */

function updatePlayerUI(){

    if(!state.current){

        $("nowName").textContent =
            "未选择电台";

        $("nowDesc").textContent =
            "选择一个频道开始播放";

        $("nowCover").innerHTML =
            defaultCover();

        return;

    }


    const station =
        state.current;


    $("nowName").textContent =
        station.name;


    $("nowDesc").textContent =
        station.description ||
        station.category ||
        "LIVE RADIO";


    $("nowCover").innerHTML =

        station.cover

            ? `
                <img
                    src="${escapeHTML(station.cover)}"
                    alt="">
              `

            : defaultCover();


    $("favoriteButton")
        .classList.toggle(
            "active",
            state.favorites.has(
                stationId(station)
            )
        );

}


function updatePlayIcon(){

    $("playIcon").innerHTML =

        audio.paused

            ? `
                <path
                    d="M8 5v14l11-7z"/>
              `

            : `
                <path
                    d="M7 5h3v14H7zm7 0h3v14h-3z"/>
              `;


    renderStations();

}


/* =========================================================
   DESTROY HLS
========================================================= */

function destroyHLS(){

    if(state.hls){

        try{

            state.hls.destroy();

        }
        catch(e){}

        state.hls = null;

    }

}


/* =========================================================
   PLAY STATION
========================================================= */

async function playStation(station){

    if(!station){

        return;

    }


    destroyHLS();


    state.current =
        station;


    updatePlayerUI();

    renderStations();


    setStatus("连接中…");


    audio.pause();

    audio.removeAttribute("src");

    audio.load();


    const url =
        String(station.url || "").trim();


    const type =
        String(
            station.type || ""
        ).toLowerCase();


    const isHLS =
        type === "m3u8" ||
        /\.m3u8(?:\?|$)/i.test(url);


    try{

        /*
         * Chrome / Edge / Firefox
         *
         * 浏览器端 HLS。
         *
         * Worker 完全不接触音频。
         */

        if(
            isHLS &&
            window.Hls &&
            Hls.isSupported()
        ){

            const hls =
                new Hls({

                    enableWorker:true,

                    lowLatencyMode:true,

                    backBufferLength:30,

                    maxBufferLength:15,

                    liveDurationInfinity:true,

                    maxLiveSyncPlaybackRate:1.2

                });


            state.hls =
                hls;


            hls.on(
                Hls.Events.ERROR,
                function(event,data){

                    console.warn(
                        "HLS:",
                        data
                    );


                    if(!data.fatal){

                        return;

                    }


                    if(
                        data.type ===
                        Hls.ErrorTypes.NETWORK_ERROR
                    ){

                        setStatus(
                            "网络错误，正在重试…"
                        );

                        try{

                            hls.startLoad();

                        }
                        catch(e){}

                    }

                    else if(
                        data.type ===
                        Hls.ErrorTypes.MEDIA_ERROR
                    ){

                        setStatus(
                            "恢复媒体…"
                        );

                        try{

                            hls.recoverMediaError();

                        }
                        catch(e){}

                    }

                    else{

                        setStatus(
                            "M3U8 无法播放"
                        );

                    }

                }
            );


            hls.on(
                Hls.Events.MANIFEST_PARSED,
                async function(){

                    await startAudio();

                }
            );


            hls.loadSource(url);

            hls.attachMedia(audio);

            return;

        }


        /*
         * Safari / iOS 等原生 HLS
         */

        if(
            isHLS &&
            audio.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ){

            audio.src =
                url;

            await startAudio();

            return;

        }


        /*
         * MP3 / AAC / OGG 等浏览器原生支持
         */

        audio.src =
            url;

        await startAudio();

    }
    catch(error){

        console.error(error);

        setStatus(
            "播放失败"
        );

    }

}


/* =========================================================
   START AUDIO
========================================================= */

async function startAudio(){

    try{

        await audio.play();

        setStatus("LIVE");

        updatePlayIcon();

    }
    catch(error){

        setStatus(
            "点击播放按钮"
        );

        updatePlayIcon();

    }

}


function playStationByUrl(url){

    const station =
        state.stations.find(
            s => s.url === url
        );


    if(station){

        playStation(station);

    }

}


window.playStationByUrl =
    playStationByUrl;


window.selectCategory =
    selectCategory;


/* =========================================================
   NEXT / PREVIOUS
========================================================= */

function changeStation(direction){

    if(!state.filtered.length){

        return;

    }


    let index =
        state.filtered.findIndex(
            station =>
                state.current &&
                stationId(station) ===
                stationId(state.current)
        );


    if(index < 0){

        index = 0;

    }
    else{

        index =
            (
                index +
                direction +
                state.filtered.length
            )
            %
            state.filtered.length;

    }


    playStation(
        state.filtered[index]
    );

}


/* =========================================================
   EVENTS
========================================================= */

$("playButton").onclick = function(){

    if(!state.current){

        if(state.filtered[0]){

            playStation(
                state.filtered[0]
            );

        }

        return;

    }


    if(audio.paused){

        startAudio();

    }
    else{

        audio.pause();

    }

};


$("heroPlay").onclick = function(){

    if(state.current){

        startAudio();

    }
    else if(state.stations[0]){

        playStation(
            state.stations[0]
        );

    }

};


$("previous").onclick =
    () => changeStation(-1);


$("next").onclick =
    () => changeStation(1);


$("volume").oninput =
    event => {

        audio.volume =
            Number(
                event.target.value
            );

    };


audio.volume = .8;


audio.addEventListener(
    "play",
    function(){

        setStatus("LIVE");

        updatePlayIcon();

    }
);


audio.addEventListener(
    "pause",
    function(){

        if(state.current){

            setStatus("已暂停");

        }

        updatePlayIcon();

    }
);


audio.addEventListener(
    "playing",
    function(){

        setStatus("LIVE");

        updatePlayIcon();

    }
);


audio.addEventListener(
    "waiting",
    function(){

        setStatus("缓冲中…");

    }
);


audio.addEventListener(
    "error",
    function(){

        if(state.current){

            setStatus(
                "源站拒绝播放或网络错误"
            );

        }

    }
);


/* =========================
   SEARCH
========================= */

$("search").addEventListener(
    "input",
    renderStations
);


/* =========================
   REFRESH
========================= */

$("refresh").onclick =
    loadConfig;


/* =========================
   FAVORITE
========================= */

$("favoriteButton").onclick =
    function(){

        if(!state.current){

            return;

        }


        const id =
            stationId(
                state.current
            );


        if(
            state.favorites.has(id)
        ){

            state.favorites.delete(id);

        }
        else{

            state.favorites.add(id);

        }


        saveFavorites();

        updatePlayerUI();

        renderStations();

    };


function showFavorites(){

    state.category =
        state.category === "收藏"
            ? "全部"
            : "收藏";


    renderCategories();

    renderStations();

}


$("favoriteTop").onclick =
    showFavorites;


$("navFav").onclick =
    showFavorites;


$("navAll").onclick =
    function(){

        state.category =
            "全部";

        renderCategories();

        renderStations();

    };


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.target.tagName ===
            "INPUT"
        ){

            return;

        }


        if(event.code === "Space"){

            event.preventDefault();

            $("playButton").click();

        }


        if(event.key === "ArrowLeft"){

            changeStation(-1);

        }


        if(event.key === "ArrowRight"){

            changeStation(1);

        }

    }
);


/* =========================================================
   START
========================================================= */

loadConfig();

</script>
