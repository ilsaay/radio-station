<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>在线广播</title>
<style>
:root{--bg:#0f0f0f;--card:#191919;--line:#2a2a2a;--text:#fff;--muted:#888;--red:#ff0033}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{padding:0 0 96px}
header{padding:28px 24px 12px;max-width:1100px;margin:0 auto}
header h1{margin:0;font-size:24px;letter-spacing:-.02em}
header p{margin:8px 0 0;color:var(--muted);font-size:13px}
main{max-width:1100px;margin:0 auto;padding:12px 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
.card{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;transition:.15s}
.card:hover{border-color:#3a3a3a}
.card.playing{border-color:var(--red)}
.card .name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{font-size:12px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
.status-bar{max-width:1100px;margin:16px auto 0;padding:0 24px;color:var(--muted);font-size:12px}
.empty{padding:60px 20px;text-align:center;color:#666;border:1px dashed #333;border-radius:14px}
.bar{position:fixed;left:0;right:0;bottom:0;height:80px;background:rgba(18,18,18,.98);border-top:1px solid var(--line);backdrop-filter:blur(16px);display:flex;align-items:center;padding:0 22px;gap:16px}
.bar .info{flex:1;min-width:0}
.bar .title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sub{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{width:52px;height:52px;border-radius:50%;border:0;background:#fff;color:#111;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.bar button:disabled{opacity:.35;cursor:default}
.bar button svg{width:22px;height:22px;fill:currentColor}
@media(max-width:600px){header{padding:20px 16px 8px}main{padding:8px 16px}.status-bar{padding:0 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
</style>
</head>
<body>
<header>
  <h1 id="siteName">在线广播</h1>
  <p id="siteDesc"></p>
</header>
<main>
  <div class="grid" id="grid"></div>
</main>
<div class="status-bar" id="status">加载中…</div>
<div class="bar">
  <div class="info">
    <div class="title" id="nowName">未选择电台</div>
    <div class="sub" id="nowSub">点击上方卡片开始播放</div>
  </div>
  <button id="playBtn" disabled>
    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>
</div>
<audio id="audio" preload="none"></audio>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const audio = $('audio');
const state = { stations: [], current: null, hls: null };

const setStatus = t => { $('status').textContent = t; };

function proxied(url) {
  return location.origin + '/proxy?url=' + encodeURIComponent(url);
}

function playIcon(playing) {
  $('playIcon').innerHTML = playing
    ? '<path d="M7 5h3v14H7zm7 0h3v14h-3z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

async function loadConfig() {
  setStatus('加载配置…');
  try {
    const r = await fetch('/api/stations?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    state.stations = (data.stations || []).filter(s => s.url);
    if (data.site) {
      if (data.site.name) { $('siteName').textContent = data.site.name; document.title = data.site.name; }
      if (data.site.description) $('siteDesc').textContent = data.site.description;
    }
    render();
    setStatus(state.stations.length ? '就绪' : '配置里没有可用电台');
  } catch (e) {
    $('grid').innerHTML = '<div class="empty">读取配置失败：' + e.message + '</div>';
    setStatus('配置错误');
  }
}

function render() {
  if (!state.stations.length) {
    $('grid').innerHTML = '<div class="empty">没有电台</div>';
    return;
  }
  $('grid').innerHTML = state.stations.map((s, i) => {
    const playing = state.current === s && !audio.paused;
    return `<div class="card ${playing ? 'playing' : ''}" data-i="${i}">
      <div class="name">${esc(s.name)}</div>
      <div class="sub">${esc(s.category || s.description || '')}</div>
    </div>`;
  }).join('');
  for (const el of $('grid').querySelectorAll('.card')) {
    el.onclick = () => playStation(state.stations[+el.dataset.i]);
  }
}

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function destroyHls() {
  if (state.hls) { try { state.hls.destroy(); } catch {} state.hls = null; }
}

function setNow(s) {
  $('nowName').textContent = s ? s.name : '未选择电台';
  $('nowSub').textContent = s ? (s.description || s.category || 'LIVE') : '点击上方卡片开始播放';
  $('playBtn').disabled = !s;
}

async function tryPlay() {
  try { await audio.play(); setStatus('播放中'); playIcon(true); render(); }
  catch { setStatus('点击播放按钮开始'); playIcon(false); }
}

function isHls(s) {
  return (s.type || '').toLowerCase() === 'm3u8' || /\.m3u8(\?|$)/i.test(s.url);
}

function playStation(s) {
  if (!s) return;
  state.current = s;
  destroyHls();
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  setNow(s);
  render();

  const src = proxied(s.url);
  setStatus('连接中…');

  if (isHls(s)) {
    if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({ enableWorker: true, lowLatencyMode: false });
      state.hls = hls;
      hls.on(Hls.Events.MANIFEST_PARSED, () => tryPlay());
      hls.on(Hls.Events.ERROR, (_, d) => {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
          setStatus('网络错误：' + d.details);
          hls.destroy(); state.hls = null;
        } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) {
          setStatus('媒体错误，尝试恢复…');
          hls.recoverMediaError();
        } else {
          setStatus('播放失败：' + d.details);
          hls.destroy(); state.hls = null;
        }
      });
      hls.loadSource(src);
      hls.attachMedia(audio);
    } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
      audio.src = src;
      audio.onloadedmetadata = () => tryPlay();
    } else {
      setStatus('浏览器不支持 HLS');
    }
  } else {
    audio.src = src;
    audio.onloadedmetadata = () => tryPlay();
  }
}

$('playBtn').onclick = () => {
  if (!state.current) return;
  if (audio.paused) tryPlay(); else audio.pause();
};

audio.addEventListener('playing', () => { setStatus('播放中'); playIcon(true); render(); });
audio.addEventListener('pause', () => { playIcon(false); render(); });
audio.addEventListener('waiting', () => setStatus('缓冲中…'));
audio.addEventListener('error', () => setStatus('播放出错'));

loadConfig();
</script>
</body>
</html>
