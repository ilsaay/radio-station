; ============================================================
; 广播站配置文件
; ============================================================
;
; 修改这个文件即可添加 / 删除 / 修改电台。
;
; 不需要修改 index.html。
; 不需要修改 _worker.js。
;
; 每个 [radio...] 都代表一个电台。
;
; ============================================================


[site]
name=广播电台
title=在线广播
description=收听你喜欢的网络电台


[radio]
name=喜马拉雅广播
url=https://live.ximalaya.com/radio-first-page-app/live/2910/64.m3u8
type=m3u8
category=音乐
description=喜马拉雅网络广播


