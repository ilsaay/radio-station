; ============================================================
; 广播站配置
; ============================================================
; 以后只需要修改这个文件。
; 不需要修改 index.html。
;
; 每一个 [radio]、[radio2]、[radio3]……
; 都代表一个电台。
;
; 可以无限添加。
; ============================================================

[site]
name=广播电台
title=在线广播
description=收听你喜欢的网络电台


[radio]
name=喜马拉雅广播
url=https://live.ximalaya.com/radio-first-page-app/live/2910/64.m3u8
type=m3u8
category=音乐
description=喜马拉雅网络广播


; ============================================================
; 下面是添加电台的格式
; ============================================================

; [radio2]
; name=我的MP3电台
; url=https://example.com/radio.mp3
; type=mp3
; category=音乐
; description=我的网络广播

; [radio3]
; name=我的M3U8电台
; url=https://example.com/live.m3u8
